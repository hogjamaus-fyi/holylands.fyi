  <script src="lang.js?v=20260601b"></script>
  <script>
    (function renderShareIcons() {
      const cloud = document.getElementById('share-cloud');
      if (!cloud) {
        return;
      }

      const shareTarget = window.location.origin + '/index.html';
      const shareText = 'New Jerusalem (HL) - HolyLands.fyi';
      const encodedUrl = encodeURIComponent(shareTarget);
      const encodedText = encodeURIComponent(shareText);

      const endpoints = {
        facebook: 'https://www.facebook.com/sharer/sharer.php?u=' + encodedUrl,
        x: 'https://twitter.com/intent/tweet?url=' + encodedUrl + '&text=' + encodedText,
        linkedin: 'https://www.linkedin.com/sharing/share-offsite/?url=' + encodedUrl,
        reddit: 'https://www.reddit.com/submit?url=' + encodedUrl + '&title=' + encodedText,
        whatsapp: 'https://api.whatsapp.com/send?text=' + encodedText + '%20' + encodedUrl,
        telegram: 'https://t.me/share/url?url=' + encodedUrl + '&text=' + encodedText,
        pinterest: 'https://pinterest.com/pin/create/button/?url=' + encodedUrl + '&description=' + encodedText,
        tumblr: 'https://www.tumblr.com/widgets/share/tool?canonicalUrl=' + encodedUrl + '&title=' + encodedText,
        vk: 'https://vk.com/share.php?url=' + encodedUrl,
        ok: 'https://connect.ok.ru/offer?url=' + encodedUrl + '&title=' + encodedText,
        xing: 'https://www.xing.com/spi/shares/new?url=' + encodedUrl,
        line: 'https://social-plugins.line.me/lineit/share?url=' + encodedUrl,
        pocket: 'https://getpocket.com/edit?url=' + encodedUrl + '&title=' + encodedText,
        hn: 'https://news.ycombinator.com/submitlink?u=' + encodedUrl + '&t=' + encodedText,
        mastodon: 'https://mastodon.social/share?text=' + encodedText + '%20' + encodedUrl,
        bluesky: 'https://bsky.app/intent/compose?text=' + encodedText + '%20' + encodedUrl,
        threads: 'https://www.threads.net/intent/post?text=' + encodedText + '%20' + encodedUrl,
        weibo: 'https://service.weibo.com/share/share.php?url=' + encodedUrl + '&title=' + encodedText,
        qq: 'https://connect.qq.com/widget/shareqq/index.html?url=' + encodedUrl + '&title=' + encodedText,
        qzone: 'https://sns.qzone.qq.com/cgi-bin/qzshare/cgi_qzshare_onekey?url=' + encodedUrl + '&title=' + encodedText,
        douban: 'https://www.douban.com/share/service?href=' + encodedUrl + '&name=' + encodedText,
        blogger: 'https://www.blogger.com/blog-this.g?u=' + encodedUrl + '&n=' + encodedText,
        flipboard: 'https://share.flipboard.com/bookmarklet/popout?v=2&url=' + encodedUrl,
        digg: 'http://digg.com/submit?url=' + encodedUrl,
        teams: 'https://teams.microsoft.com/share?href=' + encodedUrl + '&msgText=' + encodedText,
        instapaper: 'https://www.instapaper.com/edit?url=' + encodedUrl + '&title=' + encodedText,
        slashdot: 'https://slashdot.org/submit.pl?url=' + encodedUrl + '&title=' + encodedText,
        email: 'mailto:?subject=' + encodedText + '&body=' + encodedText + '%20' + encodedUrl,
        gmail: 'https://mail.google.com/mail/?view=cm&fs=1&su=' + encodedText + '&body=' + encodedText + '%20' + encodedUrl,
        outlook: 'https://outlook.live.com/mail/0/deeplink/compose?subject=' + encodedText + '&body=' + encodedText + '%20' + encodedUrl,
        yahoo: 'https://compose.mail.yahoo.com/?subject=' + encodedText + '&body=' + encodedText + '%20' + encodedUrl,
        sms: 'sms:?body=' + encodedText + '%20' + encodedUrl,
        buffer: 'https://buffer.com/add?url=' + encodedUrl + '&text=' + encodedText,
        plurk: 'https://www.plurk.com/?qualifier=shares&status=' + encodedText + '%20' + encodedUrl,
        diaspora: 'https://share.diasporafoundation.org/?title=' + encodedText + '&url=' + encodedUrl,
        kakaostory: 'https://story.kakao.com/share?url=' + encodedUrl,
        skype: 'https://web.skype.com/share?url=' + encodedUrl,
        livejournal: 'https://www.livejournal.com/update.bml?subject=' + encodedText + '&event=' + encodedText + '%20' + encodedUrl,
        pinboard: 'https://pinboard.in/add?url=' + encodedUrl + '&title=' + encodedText
      };

      const platforms = [
        { n: 'Facebook', icon: 'facebook', u: endpoints.facebook },
        { n: 'X', icon: 'x', u: endpoints.x },
        { n: 'Threads', icon: 'threads', u: endpoints.threads },
        { n: 'Bluesky', icon: 'bluesky', u: endpoints.bluesky },
        { n: 'Mastodon', icon: 'mastodon', u: endpoints.mastodon },
        { n: 'Reddit', icon: 'reddit', u: endpoints.reddit },
        { n: 'LinkedIn', icon: 'linkedin', u: endpoints.linkedin },
        { n: 'WhatsApp', icon: 'whatsapp', u: endpoints.whatsapp },
        { n: 'Telegram', icon: 'telegram', u: endpoints.telegram },
        { n: 'Line', icon: 'line', u: endpoints.line },
        { n: 'QQ', icon: 'qq', u: endpoints.qq },
        { n: 'Qzone', icon: 'qzone', u: endpoints.qzone },
        { n: 'KakaoStory', icon: 'kakaotalk', u: endpoints.kakaostory },
        { n: 'Skype', icon: 'skype', u: endpoints.skype },
        { n: 'Pinterest', icon: 'pinterest', u: endpoints.pinterest },
        { n: 'Tumblr', icon: 'tumblr', u: endpoints.tumblr },
        { n: 'Blogger', icon: 'blogger', u: endpoints.blogger },
        { n: 'Weibo', icon: 'sinaweibo', u: endpoints.weibo },
        { n: 'VK', icon: 'vk', u: endpoints.vk },
        { n: 'Odnoklassniki', icon: 'odnoklassniki', u: endpoints.ok },
        { n: 'Xing', icon: 'xing', u: endpoints.xing },
        { n: 'Douban', icon: 'douban', u: endpoints.douban },
        { n: 'Hacker News', icon: 'ycombinator', u: endpoints.hn },
        { n: 'Slashdot', icon: 'slashdot', u: endpoints.slashdot },
        { n: 'Digg', icon: 'digg', u: endpoints.digg },
        { n: 'Flipboard', icon: 'flipboard', u: endpoints.flipboard },
        { n: 'Pocket', icon: 'pocket', u: endpoints.pocket },
        { n: 'Instapaper', icon: 'instapaper', u: endpoints.instapaper },
        { n: 'Pinboard', icon: 'pinboard', u: endpoints.pinboard },
        { n: 'Buffer', icon: 'buffer', u: endpoints.buffer },
        { n: 'Plurk', icon: 'plurk', u: endpoints.plurk },
        { n: 'diaspora*', icon: 'diaspora', u: endpoints.diaspora },
        { n: 'LiveJournal', icon: 'livejournal', u: endpoints.livejournal },
        { n: 'Microsoft Teams', icon: 'microsoftteams', u: endpoints.teams },
        { n: 'Gmail', icon: 'gmail', u: endpoints.gmail },
        { n: 'Outlook', icon: 'microsoftoutlook', u: endpoints.outlook },
        { n: 'Yahoo Mail', icon: 'yahoo', u: endpoints.yahoo },
        { n: 'SMS', icon: 'googlemessages', u: endpoints.sms },
        { n: 'Email', icon: 'maildotru', u: endpoints.email }
      ];

      cloud.innerHTML = '';

      platforms.forEach(function (platform) {
        let fallbackHost = '';
        try {
          fallbackHost = new URL(platform.u).hostname;
        } catch (error) {
          fallbackHost = 'gmail.com';
        }

        const link = document.createElement('a');
        link.className = 'share-icon';
        link.href = platform.u;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.title = 'Share on ' + platform.n;
        link.setAttribute('aria-label', 'Share on ' + platform.n);

        const img = document.createElement('img');
        img.className = 'share-icon-img';
        img.src = 'https://cdn.simpleicons.org/' + platform.icon;
        img.alt = platform.n;
        img.loading = 'lazy';
        img.decoding = 'async';
        img.referrerPolicy = 'no-referrer';
        img.addEventListener('error', function onIconError() {
          if (img.dataset.fallbackLoaded === '1') {
            return;
          }
          img.dataset.fallbackLoaded = '1';
          img.src = 'https://www.google.com/s2/favicons?sz=64&domain=' + encodeURIComponent(fallbackHost);
        });

        link.appendChild(img);
        cloud.appendChild(link);
      });
    })();
  </script>
